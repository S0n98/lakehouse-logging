# Trino query audit: emits QueryCreated/QueryCompleted events as JSON over
# HTTP POST. Points at the audit-shim (see ./audit-shim.yaml), NOT directly
# at fluent-bit -- this cluster's fluent-bit build has a confirmed bug where
# its `http` input never hands records to any network output (opensearch,
# es, even loki). The shim just prints the POST body to its own stdout,
# which fluent-bit already tails successfully via the existing `tail` input.
# Fluent Bit picks Trino's lines out of that stream by the presence of the
# "queryId" field, which every http-event-listener payload has (see the
# trino_audit_emitter rewrite_tag rule in ../fluent-bit/values.yaml).
# Goes on the coordinator only (event-listener.name=http is a coordinator-only
# plugin). Referenced via coordinator.additionalConfigFiles in the trino helm
# values (see ../../README.md "Applying the Trino/Ranger/Superset changes").
event-listener.name=http
http-event-listener.log-created=true
http-event-listener.log-completed=true
http-event-listener.connect-ingest-uri=http://trino-audit-shim.monitoring.svc.cluster.local:8080/
http-event-listener.connect-retry-count=3
http-event-listener.connect-retry-delay=1s
