# Helm values for opensearch-project/helm-charts :: opensearch-dashboards
#
# Install:
#   helm install opensearch-dashboards opensearch/opensearch-dashboards \
#     -n logging -f dashboards-values.yaml

opensearchHosts: "https://opensearch-cluster-master:9200"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: audit-logs.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
