# Helm values for opensearch-project/helm-charts :: opensearch-dashboards
#
# Install:
#   helm install opensearch-dashboards opensearch/opensearch-dashboards \
#     -n logging -f dashboards-values.yaml

opensearchHosts: "https://opensearch-cluster-master:9200"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: audit-logs.local
      paths:
        - path: /
          # This chart's ingress template needs the backend spelled out
          # explicitly (old-style, doesn't default to the release's own
          # service/port the way some other charts' ingress templates do)
          # -- omitting this fails with a nil-pointer error on
          # `.backend.serviceName`. Service name matches the helm release
          # name below (opensearch-dashboards); port 5601 is this chart's
          # default (see `service.port` in its own values.yaml).
          backend:
            serviceName: opensearch-dashboards
            servicePort: 5601
  tls: []
