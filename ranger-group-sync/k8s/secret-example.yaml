# Placeholders only -- do NOT commit real credentials to git. Create the
# real secret imperatively instead, e.g.:
#
#   kubectl create secret generic ranger-group-sync-secrets \
#     --namespace=ranger-group-sync \
#     --from-literal=RANGER_USER=ranger-group-sync-svc \
#     --from-literal=RANGER_PASSWORD='<the real password>' \
#     --from-literal=KAFKA_BOOTSTRAP_SERVERS='kafka-broker-1:9092,kafka-broker-2:9092'
#
# See IMPLEMENTATION-GUIDE.md step 1 for creating the Ranger service
# account this password belongs to.
apiVersion: v1
kind: Secret
metadata:
  name: ranger-group-sync-secrets
  namespace: ranger-group-sync
type: Opaque
stringData:
  RANGER_USER: "<REDACTED-set-a-dedicated-ranger-service-account-username>"
  RANGER_PASSWORD: "<REDACTED-set-its-password>"
  KAFKA_BOOTSTRAP_SERVERS: "<REDACTED-e.g. kafka-broker-1:9092,kafka-broker-2:9092>"
